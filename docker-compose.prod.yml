# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  app:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  web:
    ports:
      - "${APP_PORT:-80}:80"

  # Horizon is not installed in composer.json — use queue worker only.
  horizon:
    profiles:
      - disabled
